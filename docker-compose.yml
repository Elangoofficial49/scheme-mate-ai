version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: schememate-db
    environment:
      POSTGRES_DB: schememate
      POSTGRES_USER: schememate_user
      POSTGRES_PASSWORD: schememate_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schememate_user -d schememate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schememate-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schememate-backend
    environment:
      - DATABASE_URL=postgresql://schememate_user:schememate_password@postgres:5432/schememate
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=schememate_ai_super_secret_jwt_key_2026_change_in_production
      - JWT_REFRESH_SECRET=schememate_ai_super_secret_refresh_key_2026_change_in_production
      - AI_PROVIDER=local
      - OCR_PROVIDER=tesseract
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: schememate-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:

