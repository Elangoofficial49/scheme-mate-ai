version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: schememate-db
    environment:
      POSTGRES_DB: schememate
      POSTGRES_USER: schememate_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schememate_user -d schememate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schememate-redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schememate-backend
    environment:
      - DATABASE_URL=postgresql://schememate_user:${POSTGRES_PASSWORD}@postgres:5432/schememate
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - AI_PROVIDER=local
      - OCR_PROVIDER=tesseract
      - UPLOAD_DIR=/var/lib/schememate/uploads
    volumes:
      - uploads:/var/lib/schememate/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: schememate-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:

