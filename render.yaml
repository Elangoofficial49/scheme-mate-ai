services:
  - type: web
    name: scheme-mate-app
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements.txt && bash scripts/render-build.sh
    preDeployCommand: cd backend && python -m alembic upgrade head
    startCommand: cd backend && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/lib/schememate
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: postgresql://schememate_ai_user:zuGoo3gOaqChEABsoSs83agyZQ9prZDl@dpg-db4faqvlk1mc73frr69g-a.singapore-postgres.render.com/schememate_ai
        fromDatabase:
          name: scheme-mate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: local
      - key: OCR_PROVIDER
        value: tesseract
      - key: UPLOAD_DIR
        value: /tmp/schememate-uploads
      - key: MONGODB_URL
        value: ""
      - key: MONGODB_DB_NAME
        value: schememate_ai
      - key: FLUTTER_VERSION
        value: 3.47.2

