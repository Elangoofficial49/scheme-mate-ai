name: DevSecOps Pipeline - SchemeMate AI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit safety pytest pytest-asyncio

      - name: 1. Code Linting Check
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 2. Secret Detection & Security SAST Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii

      - name: 3. Dependency Vulnerability Scan (Safety)
        run: |
          safety check || echo "Dependency scan completed with warnings"

      - name: 4. Execute Automated Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: 5. Build Docker Containers
        run: |
          docker build -t schememate-backend:latest ./backend

